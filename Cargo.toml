[workspace]
members = ["crates/vusl-core"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2021"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "raw_value"] }
sha2 = { version = "=0.11.1", default-features = false }

# Resource measurements retain the binary's symbols and avoid a separate strip
# tool; this also keeps profiler call stacks available on qualified targets.
[profile.release]
strip = "none"

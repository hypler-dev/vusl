[workspace]
resolver = "2"

[package]
name = "vusl-consumer-rangoon-constraints-fixture"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.1"
publish = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.11.0"
vusl-core = { path = "../../../crates/vusl-core" }

[features]
default = ["derive-check"]
derive-check = ["serde/derive"]

[[test]]
name = "smoke"
path = "../smoke.rs"
harness = false
